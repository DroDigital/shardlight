# Desktop builds: Shardlight for macOS, Windows and Linux, each built on its own OS.
# Every push and pull request uploads the builds as workflow artifacts; a tag like v1.0.0 also attaches them to a
# GitHub release.
name: desktop
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: npm run build
      - run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          # no signing certificates are configured: builds are unsigned (macOS gets an ad-hoc signature)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # the packaged app must start and reach the game
      - name: smoke test (linux)
        if: matrix.target == 'linux'
        run: |
          npm i --no-save playwright@1.49.1
          xvfb-run -a node tools/desktop-check.cjs release/linux-unpacked/shardlight
      - uses: actions/upload-artifact@v4
        with:
          name: shardlight-${{ matrix.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
            release/*.dmg
            release/*.zip
